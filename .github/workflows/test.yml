name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source, scripts, links, and publication files
        run: python scripts/check_release.py
      - name: Check launchers, paths, normalization, and export behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
